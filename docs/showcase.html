<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>artemis-design — showcase</title>
  <link rel="stylesheet" href="artemis.css">
  <script>
    // ?theme=light|dark
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  </script>
</head>
<body class="art-page art-page--with-topbar">
  <header class="art-topbar">
    <div class="art-topbar__inner">
      <span class="art-topbar__title">Directory</span>
      <nav class="art-topbar__links">
        <a class="art-link" href="#">git</a><span class="art-sep">·</span>
        <a class="art-link" href="#">music</a><span class="art-sep">·</span>
        <a class="art-link" href="#">draw</a><span class="art-sep">·</span>
        <a class="art-link" href="#">notebook</a><span class="art-sep">·</span>
        <a class="art-link" href="#">irc</a>
      </nav>
    </div>
  </header>

  <div class="art-stack">
    <div>
      <header class="art-header">
        <span class="art-header__title">artemis</span>
        <span class="art-status"><span class="art-status__dot"></span><span>online</span></span>
      </header>
      <br>
      <header class="art-header">
        <span class="art-header__title">artemis</span>
        <span class="art-status art-status--positive">
          <svg class="art-status__icon" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Home or VPN connected</span>
        </span>
      </header>
    </div>

    <div>
      <div class="art-meters">
        <div class="art-meter">
          <div class="art-meter__head"><span class="art-meter__label">CPU</span><span class="art-meter__value">42%</span></div>
          <div class="art-meter__track"><div class="art-meter__fill" style="width:42%"></div></div>
        </div>
        <div class="art-meter">
          <div class="art-meter__head"><span class="art-meter__label">RAM</span><span class="art-meter__value">6.2 / 16.0 GB <span class="art-meter__pct">(39%)</span></span></div>
          <div class="art-meter__track"><div class="art-meter__fill" style="width:39%"></div></div>
        </div>
        <div class="art-meter">
          <div class="art-meter__head"><span class="art-meter__label">DISK</span><span class="art-meter__value">812 / 1000 GB <span class="art-meter__pct">(81%)</span></span></div>
          <div class="art-meter__track"><div class="art-meter__fill" style="width:81%"></div></div>
        </div>
      </div>
      <div class="art-stats"><span>uptime 12d</span><span>load 0.42</span></div>
    </div>

    <footer class="art-footer">
      <blockquote class="art-quote">
        “A golden key opens every door, save that of heaven.”
        <cite>— George Herbert, <em>Jacula Prudentum</em></cite>
      </blockquote>
      <div class="art-note">services accessible only on vpn</div>
    </footer>
  </div>
</body>
</html>
